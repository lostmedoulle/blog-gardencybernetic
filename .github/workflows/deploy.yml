name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer un déploiement à la main depuis l'onglet Actions,
  # notamment juste après avoir activé Pages dans les réglages du dépôt.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Le build est séparé du déploiement : il valide le contenu à chaque push,
  # même tant que GitHub Pages n'est pas encore activé sur le dépôt.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # `npm run build` déclenche validate:content et generate:index via le
      # hook prebuild : un frontmatter invalide échoue ici, avant publication.
      - name: Construire le site
        run: npm run build

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tente de créer le site Pages s'il n'existe pas encore. Sur un dépôt
      # privé cet appel échoue (Pages y exige un plan payant) ; sur un dépôt
      # public il crée le site avec le GITHUB_TOKEN.
      # Placée dans le job `deploy` et non `build` : un échec ici ne doit pas
      # empêcher la validation du contenu ni la compilation.
      - name: Activer GitHub Pages si nécessaire
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
