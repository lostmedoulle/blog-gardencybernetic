name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer un déploiement à la main depuis l'onglet Actions,
  # notamment juste après avoir activé Pages dans les réglages du dépôt.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Le build est séparé du déploiement : il valide le contenu à chaque push,
  # même tant que GitHub Pages n'est pas encore activé sur le dépôt.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # `npm run build` déclenche validate:content et generate:index via le
      # hook prebuild : un frontmatter invalide échoue ici, avant publication.
      - name: Construire le site
        run: npm run build

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Prérequis : Settings → Pages → Source : GitHub Actions.
      # Cette activation ne peut pas être faite par le workflow : le
      # GITHUB_TOKEN peut déployer vers un site Pages existant, mais pas en
      # créer un (« Resource not accessible by integration »). C'est une
      # restriction volontaire de GitHub, réservée à un administrateur.
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
