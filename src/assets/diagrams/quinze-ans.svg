<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 666" width="480" height="666" role="img" aria-label="Chronologie sur quinze ans : année zéro l'automatisation apporte un gain réel, année deux les cas simples ne remontent plus, année quatre le premier poste junior n'est pas remplacé, année huit il n'y a plus de junior, année douze les seniors partent et le système tourne toujours, année quinze une anomalie ancienne apparaît que plus personne ne sait diagnostiquer.">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f87171" stop-opacity=".85"/>
    </linearGradient>
    <style>
      .yr { font: 700 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8092ab; letter-spacing: .05em; }
      .lb { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; letter-spacing: .04em; }
      .tx { font: 13.5px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #cbd5e1; }
      .ax { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; letter-spacing: .1em; }
      .ft { font: italic 12.5px ui-sans-serif, system-ui, sans-serif; fill: #8092ab; }
    </style>
  </defs>
  <rect width="480" height="666" fill="#0f1524"/>

  <!-- Axe qualitatif : capacité à vérifier ce que fait le système -->
  <rect x="20" y="42" width="5" height="464" rx="2.5" fill="url(#fade)"/>
  <text x="14" y="30" class="ax">CAPACITÉ À VÉRIFIER CE QUE FAIT LE SYSTÈME</text>

  <g>
    <text x="42" y="56" class="yr">ANNÉE 0</text>
    <text x="42" y="78" class="lb">L'automatisation démarre</text>
    <text x="42" y="98" class="tx">Écritures simples, rapprochements, imputations.</text>
    <text x="42" y="118" class="tx">Le gain est réel et immédiat.</text>
  </g>
  <g>
    <text x="42" y="152" class="yr">ANNÉE 2</text>
    <text x="42" y="174" class="lb">Les cas simples ne remontent plus</text>
    <text x="42" y="194" class="tx">L'équipe ne traite que le complexe. C'est présenté</text>
    <text x="42" y="214" class="tx">comme une montée en compétence, et c'en est une.</text>
  </g>
  <g>
    <text x="42" y="248" class="yr">ANNÉE 4</text>
    <text x="42" y="270" class="lb">Le premier junior n'est pas remplacé</text>
    <text x="42" y="290" class="tx">Plus assez de volume simple pour justifier une</text>
    <text x="42" y="310" class="tx">embauche. La productivité est excellente.</text>
  </g>
  <g>
    <text x="42" y="344" class="yr">ANNÉE 8</text>
    <text x="42" y="366" class="lb">Il n'y a plus de junior du tout</text>
    <text x="42" y="386" class="tx">Le savoir tient dans quelques têtes, et il ne se</text>
    <text x="42" y="406" class="tx">reproduit plus.</text>
  </g>
  <g>
    <text x="42" y="440" class="yr">ANNÉE 12</text>
    <text x="42" y="462" class="lb">Les seniors partent à la retraite</text>
    <text x="42" y="482" class="tx">Le système tourne. Il tourne même très bien.</text>
  </g>

  <rect x="20" y="516" width="440" height="108" rx="10" fill="#151c2e" stroke="rgba(248,113,113,.45)"/>
  <rect x="20" y="516" width="3" height="108" rx="1.5" fill="#f87171"/>
  <text x="38" y="538" class="yr" fill="#f87171">ANNÉE 15</text>
  <text x="38" y="560" class="lb" fill="#f87171">Une anomalie apparaît</text>
  <text x="38" y="580" class="tx">Ancienne, répliquée des centaines de milliers de fois.</text>
  <text x="38" y="600" class="ft">Ni réparable, ni remplaçable : la remplacer</text>
  <text x="38" y="616" class="ft">supposerait de savoir ce qu'elle faisait.</text>

  <text x="240" y="650" class="ft" text-anchor="middle">Le terrain d'entraînement disparaît avant l'expertise, et de façon invisible.</text>
</svg>
